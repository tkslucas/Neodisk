name: Nightly

# Builds Neodisk Nightly from main once a day when main moved: a signed,
# notarized universal Mac app (launch-checked on Intel), Linux tarballs and
# AppImages (launch-checked headless), published to the rolling "nightly" pre-release. Off until the repository
# variable NEODISK_NIGHTLY is "true".

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: nightly

jobs:
  check:
    if: vars.NEODISK_NIGHTLY == 'true'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        run: |
          tagged=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/tags/nightly | cut -f1)
          if [[ "$tagged" == "$GITHUB_SHA" && "$GITHUB_EVENT_NAME" == schedule ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  memory:
    needs: check
    if: needs.check.outputs.build == 'true' && github.ref_name == 'main'
    uses: ./.github/workflows/memory-gate.yml
    secrets: inherit

  mac:
    needs: [check, memory]
    if: needs.check.outputs.build == 'true' && github.ref_name == 'main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: Neodisk
      - uses: actions/checkout@v4
        with:
          repository: tkslucas/neodisk-internal
          ssh-key: ${{ secrets.NEODISK_INTERNAL_KEY }}
          path: internal

      - name: Signing keychain
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # An App Store Connect API key: notarizes, can't reach the Apple ID's iCloud data.
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials neodisk-notary --keychain "$kc" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize
        env:
          NEODISK_REPO: ${{ github.workspace }}/Neodisk
          NEODISK_CHANNEL: nightly
          NEODISK_NOTARY_PROFILE: neodisk-notary
          NEODISK_NIGHTLY_ED_PUBLIC_KEY: ${{ vars.NEODISK_NIGHTLY_ED_PUBLIC_KEY }}
        run: |
          npm install --global create-dmg
          internal/scripts/package-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            Neodisk/dist/Neodisk-Nightly-*.zip
            Neodisk/dist/Neodisk-Nightly-*.dmg

  intel:
    needs: mac
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
      - name: Launch on Intel
        run: |
          ditto -x -k Neodisk-Nightly-*.zip .
          bin="Neodisk Nightly.app/Contents/MacOS/Neodisk"
          lipo "$bin" -verify_arch x86_64 arm64
          "$bin" -hasSeenWelcome YES & pid=$!
          sleep 20
          kill -0 "$pid" || { echo "Neodisk Nightly quit on Intel"; exit 1; }
          kill "$pid"

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK, libadwaita, and zstd development packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libzstd-dev pkg-config \
          curl ca-certificates dpkg-dev file librsvg2-common adwaita-icon-theme

      # Unpacks into /usr/local: sudo tar -xzf <file> -C /usr/local
      - name: Build and pack
        run: |
          version=$(sed -n 's/.*static let string = "\(.*\)".*/\1/p' Sources/NeodiskAppModel/AppVersion.swift)
          name="neodisk-nightly-$version-$(date -u +%Y%m%d)-${GITHUB_SHA::7}-linux-${{ matrix.arch }}.tar.gz"
          DESTDIR="$PWD/stage" Packaging/linux/install.sh --nightly /usr/local
          tar -C stage/usr/local -czf "$name" .
          echo "NAME=$name" >> "$GITHUB_ENV"

      # A self-contained AppImage: GTK, libadwaita and the Adwaita icons bundled.
      - name: AppImage
        env:
          ARCH: ${{ matrix.arch }}
          LINUXDEPLOY: 1-alpha-20251107-1
          GTK_PLUGIN: 7a3fbc31a9e5075073ff8790f26effbac5f84453
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: "4"
          LDAI_OUTPUT: Neodisk-Nightly-${{ matrix.arch }}.AppImage
        run: |
          mkdir tools
          curl -fsSLo tools/linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY/linuxdeploy-$ARCH.AppImage"
          curl -fsSLo tools/linuxdeploy-plugin-gtk.sh "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/$GTK_PLUGIN/linuxdeploy-plugin-gtk.sh"
          chmod +x tools/*
          DESTDIR="$PWD/AppDir" Packaging/linux/install.sh --nightly /usr
          id=com.lucastakayasu.Neodisk.Nightly
          sed -i 's|^Exec=/usr/bin/|Exec=|' "AppDir/usr/share/applications/$id.desktop"
          mkdir -p AppDir/usr/share/icons
          cp -R /usr/share/icons/Adwaita AppDir/usr/share/icons/
          PATH="$PWD/tools:$PATH" linuxdeploy --appdir AppDir --plugin gtk \
            --executable AppDir/usr/bin/neodisk-nightly \
            --desktop-file "AppDir/usr/share/applications/$id.desktop" \
            --icon-file "AppDir/usr/share/icons/hicolor/256x256/apps/$id.png"
          # libadwaita draws its own style; a forced GTK_THEME overrides it.
          sed -i '/GTK_THEME/d' AppDir/apprun-hooks/linuxdeploy-plugin-gtk.sh
          PATH="$PWD/tools:$PATH" linuxdeploy --appdir AppDir --output appimage
          ls -l "$LDAI_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            ${{ env.NAME }}
            Neodisk-Nightly-${{ matrix.arch }}.AppImage

  appimage:
    needs: linux
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
      # On the bare runner (no GTK installed): scan /usr and capture the window.
      - name: Launch the AppImage headless
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NEODISK_AUTOSCAN: /usr
          NEODISK_UI_SNAPSHOT: ${{ github.workspace }}/appimage-${{ matrix.arch }}.png
        run: |
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
          app="Neodisk-Nightly-${{ matrix.arch }}.AppImage"
          chmod +x "$app"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config" NEODISK_SNAPSHOT_DIR="$RUNNER_TEMP/snapshots"
          timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" "./$app"
          test -s "$NEODISK_UI_SNAPSHOT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}-screenshot
          path: appimage-${{ matrix.arch }}.png
          if-no-files-found: ignore

  publish:
    needs: [mac, intel, linux, appimage]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: Neodisk
      - uses: actions/checkout@v4
        with:
          repository: tkslucas/neodisk-internal
          ssh-key: ${{ secrets.NEODISK_INTERNAL_KEY }}
          path: internal
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NEODISK_REPO: ${{ github.workspace }}/Neodisk
          ED_KEY: ${{ secrets.NEODISK_NIGHTLY_ED_KEY }}
        run: |
          key="$RUNNER_TEMP/nightly-ed-key"
          printf '%s' "$ED_KEY" > "$key"
          NEODISK_NIGHTLY_ED_KEY_FILE="$key" internal/scripts/nightly.sh artifacts
          rm "$key"
